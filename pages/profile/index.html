<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="../../assets/js/auth-guard.js"></script>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="../../assets/icons/Muriquiz - Mini Logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil do Usuário - MuriQuiz</title>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('preferred-theme') || 'dark';
            if (savedTheme !== 'dark') {
                document.documentElement.classList.add(savedTheme + '-theme');
            }
        })();
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <link rel="stylesheet" href="../../assets/css/profile.css">
    <link rel="stylesheet" href="../../assets/css/themes.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        @media screen and (max-width: 768px) {
            .mobile-theme-selector {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div id="page-loader" class="page-loader">
        <div class="loader-spinner"></div>
    </div>

    <button class="sidebar-toggle" onclick="toggleSidebar()"><i data-lucide="menu"></i></button>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2 id="userNameGreeting">Carregando...</h2>
        </div>
        
        <nav class="sidebar-nav">
            <a href="../../pages/quiz/index.html" class="nav-item">
              <i data-lucide="graduation-cap"></i> Aprendizado
            </a>
            <a href="../../pages/profile/index.html" class="nav-item active">
                <i data-lucide="user"></i> Meu Perfil
            </a>
            <a href="../../pages/friends/index.html" class="nav-item">
                <i data-lucide="users"></i> Amigos
            </a>
            <a href="../../pages/schedule/index.html" class="nav-item">
                <i data-lucide="calendar-range"></i> Cronograma
            </a>
        </nav>

        <div class="sidebar-divider"></div>
  
        <div class="sidebar-settings">
            <div class="settings-header" onclick="toggleSettings()">
                <p class="settings-title">Configurações</p>
                <i data-lucide="chevron-up"></i>
            </div>
            <div class="settings-content">
                <div class="theme-options">
                    <button class="theme-btn" data-theme="dark" onclick="setTheme('dark')" title="Tema Escuro"><i data-lucide="moon"></i></button>
                    <button class="theme-btn" data-theme="light" onclick="setTheme('light')" title="Tema Claro"><i data-lucide="sun"></i></button>
                    <button class="theme-btn" data-theme="contrast" onclick="setTheme('contrast')" title="Alto Contraste"><i data-lucide="accessibility"></i></button>
                </div>
                <a href="../../pages/settings/advanced/index.html" class="delete-account-btn" style="text-decoration: none;">
                    <i data-lucide="settings"></i> Avançado
                </a>
            </div>
        </div>

        <button class="logout-btn" onclick="logout()">
            <i data-lucide="log-out"></i> Sair
        </button>
    </aside>

    <main class="main-content">
        <div class="content-wrapper">
            <h1>Seu Perfil</h1>

            <div class="profile-card">
                <div id="profile-picture-container">
                    <img id="profile-img" src="" alt="Foto de Perfil">
                    <label for="image-upload" class="upload-label"><i data-lucide="image"></i> Alterar Foto</label>
                    <input type="file" id="image-upload" accept="image/*">
                </div>

                <div class="user-info-section">
                    <div class="info-item">
                        <strong><i data-lucide="user"></i> Username</strong>
                        <span id="username">Carregando...</span>
                    </div>
                    <div class="info-item">
                        <strong><i data-lucide="user"></i> Nome Completo</strong>
                        <span id="name">Carregando...</span>
                    </div>
                    <div class="info-item" id="email-item">
                        <strong><i data-lucide="mail"></i> E-mail</strong>
                        <span id="email">Carregando...</span>
                    </div>
                    <div class="info-item">
                        <strong><i data-lucide="calendar"></i> Membro desde</strong>
                        <span id="member-since">Maio de 2026</span>
                    </div>
                </div>

                <div class="bio-section" style="width: 100%; margin-top: 10px;">
                    <div class="info-item" style="flex-direction: column; align-items: flex-start; gap: 10px;">
                        <strong><i data-lucide="book-open"></i> Sobre mim</strong>
                        <div id="bio-display-container" style="width: 100%;">
                            <p id="bio-text" style="color: var(--fg-dim); font-size: 1rem; line-height: 1.5; white-space: pre-wrap;">Nenhuma bio informada.</p>
                            <button id="edit-bio-btn" class="action-btn view-profile-btn bio-btn-small">
                                <i data-lucide="pencil"></i> Editar Bio
                            </button>
                        </div>
                        <div id="bio-edit-container" class="hidden" style="width: 100%;">
                            <textarea id="bio-input" maxlength="300" placeholder="Conte um pouco sobre você..."></textarea>
                            <div class="bio-edit-actions">
                                <button id="save-bio-btn" class="action-btn accept-btn">Salvar</button>
                                <button id="cancel-bio-btn" class="action-btn decline-btn">Cancelar</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="mobile-theme-selector" style="width: 100%; margin-top: 20px;" id="preferences-section">
                    <p class="settings-title" style="margin-bottom: 12px; text-align: center;">Preferências</p>
                    <div class="theme-options">
                        <button class="theme-btn" data-theme="dark" onclick="setTheme('dark')"><i data-lucide="moon"></i></button>
                        <button class="theme-btn" data-theme="light" onclick="setTheme('light')"><i data-lucide="sun"></i></button>
                        <button class="theme-btn" data-theme="contrast" onclick="setTheme('contrast')"><i data-lucide="accessibility"></i></button>
                    </div>
                    <a href="../../pages/settings/advanced/index.html" class="delete-account-btn" style="text-decoration: none; margin-top: 20px;">
                        <i data-lucide="settings"></i> Avançado
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal para Corte -->
    <div id="cropper-modal" class="modal">
        <div class="modal-content">
            <h3>Ajustar Imagem</h3>
            <div class="img-container">
                <img id="image-to-crop" src="">
            </div>
            <div class="btn-group">
                <button id="cancel-crop">Cancelar</button>
                <button id="confirm-crop">Salvar Alteração</button>
            </div>
        </div>
    </div>

    <!-- Cropper.js JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../../assets/js/profile.js"></script>
    <script src="../../assets/js/settings.js"></script>
    <script>
      lucide.createIcons();
    </script>
</body>
</html>
