<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="../../assets/js/auth-guard.js"></script>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="../../assets/icons/Muriquiz - Mini Logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Quiz - Configurar Horário</title>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('preferred-theme') || 'dark';
            if (savedTheme !== 'dark') {
                document.documentElement.classList.add(savedTheme + '-theme');
            }
        })();
    </script>
    <link rel="stylesheet" href="../../assets/css/auth.css">
    <link rel="stylesheet" href="../../assets/css/schedule.css">
    <link rel="stylesheet" href="../../assets/css/themes.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <div id="page-loader" class="page-loader">
        <div class="loader-spinner"></div>
    </div>
    <div id="notification-container"></div>

<button class="sidebar-toggle" onclick="toggleSidebar()"><i data-lucide="menu"></i></button>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h2 id="userNameGreeting">Carregando...</h2>
  </div>
  
  <nav class="sidebar-nav">
    <a href="../../pages/quiz/index.html" class="nav-item">
      <i data-lucide="graduation-cap"></i> Aprendizado
    </a>
    <a href="../../pages/profile/index.html" class="nav-item">
      <i data-lucide="user"></i> Meu Perfil
    </a>
    <a href="../../pages/friends/index.html" class="nav-item">
      <i data-lucide="users"></i> Amigos
    </a>
    <a href="../../pages/schedule/index.html" class="nav-item active">
      <i data-lucide="calendar-range"></i> Cronograma
    </a>
  </nav>

  <div class="sidebar-divider"></div>
  
  <div class="sidebar-settings">
    <div class="settings-header" onclick="toggleSettings()">
      <p class="settings-title">Configurações</p>
      <i data-lucide="chevron-up"></i>
    </div>
    <div class="settings-content">
      <div class="theme-options">
        <button class="theme-btn" data-theme="dark" onclick="setTheme('dark')" title="Tema Escuro"><i data-lucide="moon"></i></button>
        <button class="theme-btn" data-theme="light" onclick="setTheme('light')" title="Tema Claro"><i data-lucide="sun"></i></button>
        <button class="theme-btn" data-theme="contrast" onclick="setTheme('contrast')" title="Alto Contraste"><i data-lucide="accessibility"></i></button>
      </div>
      <a href="../../pages/settings/advanced/index.html" class="delete-account-btn" style="text-decoration: none;">
        <i data-lucide="settings"></i> Avançado
      </a>
    </div>
  </div>

  <button class="logout-btn" onclick="logout()">
    <i data-lucide="log-out"></i> Sair
  </button>
</aside>

    <main class="main-content">
        <div class="content-wrapper">
            <div class="auth-card schedule-card">
                <div class="header-actions">
                    <div>
                        <h2>Configurar Horário</h2>
                        <p>Monte sua grade escolar para que possamos organizar seus estudos.</p>
                    </div>
                    <div class="header-buttons">
                        <button type="button" id="btn-skip" class="btn-skip" onclick="skipSchedule()">Pular por enquanto</button>
                        <button type="button" id="btn-edit" class="btn-edit hidden" onclick="enableEditing()">Editar</button>
                    </div>
                </div>
                
                <form class="auth-form" id="schedule-form">
                    <div class="input-group">
                        <label for="school-year">Ano Escolar</label>
                        <select id="school-year">
                            <option value="" disabled selected>Selecione seu ano</option>
                            <optgroup label="Ensino Fundamental">
                                <option value="1f">1º Ano</option>
                                <option value="2f">2º Ano</option>
                                <option value="3f">3º Ano</option>
                                <option value="4f">4º Ano</option>
                                <option value="5f">5º Ano</option>
                                <option value="6f">6º Ano</option>
                                <option value="7f">7º Ano</option>
                                <option value="8f">8º Ano</option>
                                <option value="9f">9º Ano</option>
                            </optgroup>
                            <optgroup label="Ensino Médio">
                                <option value="1m">1º Ano</option>
                                <option value="2m">2º Ano</option>
                                <option value="3m">3º Ano</option>
                            </optgroup>
                        </select>
                    </div>

                    <div class="input-group hidden" id="modality-group">
                        <label for="modality">Modalidade</label>
                        <select id="modality">
                            <option value="" disabled selected>Selecione a modalidade</option>
                            <option value="regular">Regular (6 aulas)</option>
                            <option value="integral">Integral (9 aulas)</option>
                        </select>
                    </div>

                    <div class="schedule-table-container hidden" id="table-container">
                        <table class="schedule-table">
                            <thead>
                                <tr>
                                    <th>Horário</th>
                                    <th>Segunda</th>
                                    <th>Terça</th>
                                    <th>Quarta</th>
                                    <th>Quinta</th>
                                    <th>Sexta</th>
                                </tr>
                            </thead>
                            <tbody id="schedule-body">
                                <!-- Gerado via JS -->
                            </tbody>
                        </table>
                    </div>
                    <div class="actions hidden">
                        <button type="submit"><i data-lucide="save"></i> Salvar Horário</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../../assets/js/schedule.js"></script>
    <script src="../../assets/js/settings.js"></script>
    <script>
      lucide.createIcons();
    </script>
</body>
</html>
