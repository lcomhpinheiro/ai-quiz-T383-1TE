<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Quiz - Registro</title>
    <script src="../../assets/js/auth-guard.js"></script>
    <link rel="stylesheet" href="../../assets/css/auth.css">
</head>

<body>
    <div id="notification-container"></div>

    <main class="login-container">
        <div class="auth-card">
            <h2>Criar Conta</h2>
            <p>Preencha os dados abaixo para se cadastrar</p>
            
            <form class="auth-form" novalidate>
                <div class="input-group">
                    <label for="name">Primeiro Nome</label>
                    <input type="text" id="name" placeholder="Seu nome">
                    <span class="error-message">Nome é obrigatório</span>
                </div>

                <div class="input-group">
                    <label for="username">Usuário</label>
                    <input type="text" id="username" placeholder="Nome de usuário">
                    <span class="error-message">Usuário é obrigatório</span>
                </div>

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com">
                    <span class="error-message">E-mail inválido</span>
                </div>
                
                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="Senha">
                    <span class="error-message">Senha deve ter pelo menos 6 caracteres</span>
                </div>

                <div class="input-group">
                    <label for="confirm-password">Confirmar Senha</label>
                    <input type="password" id="confirm-password" placeholder="Repita a senha">
                    <span class="error-message">As senhas não coincidem</span>
                </div>
                
                <button type="submit">Cadastrar</button>
            </form>
            
            <div class="card-footer">
                <span>Já tem uma conta? <a href="../login/index.html">Fazer login</a></span>
            </div>
        </div>
    </main>
    <script src="../../assets/js/register.js"></script>
</body>
</html>
