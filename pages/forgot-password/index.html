<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="../../assets/js/auth-guard.js"></script>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="../../assets/icons/Muriquiz - Mini Logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuriQuiz - Esqueci Senha</title>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('preferred-theme') || 'dark';
            if (savedTheme !== 'dark') {
                document.documentElement.classList.add(savedTheme + '-theme');
            }
        })();
    </script>
    <link rel="stylesheet" href="../../assets/css/auth.css">
    <link rel="stylesheet" href="../../assets/css/themes.css">
</head>

<body>
    <div id="notification-container"></div>

    <main class="login-container">
        <div class="auth-card">
            <h2>Recuperar Senha</h2>
            <p>Insira seu e-mail para receber um link de redefinição</p>
            
            <form class="auth-form" novalidate>
                <div class="input-group">
                    <label for="email"><i data-lucide="mail"></i> E-mail da Conta</label>
                    <input type="email" id="email" placeholder="seu@email.com">
                    <span class="error-message">E-mail inválido</span>
                </div>
                
                <button type="submit"><i data-lucide="send"></i> Enviar Link</button>
            </form>
            
            <div class="card-footer">
                <span>Lembrou a senha? <a href="../../pages/login/index.html"><i data-lucide="log-in"></i> Voltar para login</a></span>
            </div>
        </div>
    </main>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../../assets/js/forgot.js"></script>
    <script>
      lucide.createIcons();
    </script>
</body>
</html>
