<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="../../assets/js/auth-guard.js"></script>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="../../assets/icons/Muriquiz - Mini Logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuriQuiz - Redefinir Senha</title>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('preferred-theme') || 'dark';
            if (savedTheme !== 'dark') {
                document.documentElement.classList.add(savedTheme + '-theme');
            }
        })();
    </script>
    <link rel="stylesheet" href="../../assets/css/auth.css">
    <link rel="stylesheet" href="../../assets/css/themes.css">
</head>

<body>
    <div id="notification-container"></div>

    <main class="login-container">
        <div class="auth-card">
            <h2>Nova Senha</h2>
            <p>Crie uma nova senha de acesso para sua conta</p>
            
            <form class="auth-form" novalidate>
                <div class="input-group">
                    <label for="password"><i data-lucide="lock"></i> Nova Senha</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="Mínimo 6 caracteres">
                        <button type="button" class="password-toggle" onclick="togglePasswordVisibility('password')">
                            <i data-lucide="eye-off"></i>
                        </button>
                    </div>
                    <span class="error-message">Senha deve ter pelo menos 6 caracteres</span>
                </div>

                <div class="input-group">
                    <label for="confirm-password"><i data-lucide="lock"></i> Confirmar Nova Senha</label>
                    <div class="input-wrapper">
                        <input type="password" id="confirm-password" placeholder="Repita a senha">
                        <button type="button" class="password-toggle" onclick="togglePasswordVisibility('confirm-password')">
                            <i data-lucide="eye-off"></i>
                        </button>
                    </div>
                    <span class="error-message">As senhas não coincidem</span>
                </div>
                
                <button type="submit"><i data-lucide="save"></i> Atualizar Senha</button>
            </form>
        </div>
    </main>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../../assets/js/reset.js"></script>
    <script>
      lucide.createIcons();
    </script>
</body>
</html>
